modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_url}"
logoFile="assets/thirst_was_upgraded/textures/icon.png"
authors="${mod_authors}"
description='''
Adds thirst-aware automatic drinking functionality
to Traveler's Backpack.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="travelersbackpack"
type="required"
versionRange="${travelers_backpack_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thirst"
type="required"
versionRange="${thirst_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="toughasnails"
type="optional"
versionRange="[10.1.0.13,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0.10,)"
ordering="AFTER"
side="BOTH"
